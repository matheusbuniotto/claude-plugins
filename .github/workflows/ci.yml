name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: for f in plugins/sol/skills/sol/*.sh plugins/sol/tests/test.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck -S warning plugins/sol/skills/sol/*.sh || true
      - name: JSON
        run: jq empty .claude-plugin/marketplace.json plugins/sol/hooks/hooks.json plugins/sol/.claude-plugin/plugin.json
      - name: Tests
        run: bash plugins/sol/tests/test.sh
